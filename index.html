<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Organização Financeira</title>
<meta name="theme-color" content="#0b3b3a">
<meta name="description" content="Organize entradas, gastos, contas, reservas e metas mês a mês.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<style>
:root{
  --deep:#0b3b3a; --deep2:#0f4d4b; --teal:#0f766e; --mint:#14b8a6; --mint-soft:#ccfbf1;
  --bg:#f3f7f6; --surface:#fff; --line:#e3ebe9; --ink:#10201f; --muted:#5f7472;
  --good:#0f9f6e; --bad:#d64045; --warn:#b7791f; --warn-soft:#fdf3e1;
  --r:18px; --shadow:0 1px 2px rgba(11,59,58,.06),0 6px 20px rgba(11,59,58,.06);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* header */
.top{background:var(--deep);color:#fff;padding:calc(var(--safe-t) + 18px) 18px 16px;position:relative}
.top .hello{font-size:22px;font-weight:700;letter-spacing:-.02em}
.top .sub{opacity:.72;font-size:14px;margin-top:2px}
.top.hero-top{padding-bottom:64px}.top.hero-top+main{margin-top:-48px}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-top:16px;
  background:rgba(255,255,255,.08);border-radius:14px;padding:4px}
.monthbar button{width:42px;height:38px;border-radius:10px;color:#fff;font-size:20px}
.monthbar button:active{background:rgba(255,255,255,.12)}
.monthbar .m{font-weight:600}
main{max-width:640px;margin:14px auto 0;padding:0 14px calc(96px + var(--safe-b));position:relative}

/* cards */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center}
.card h3 small{font-weight:500;color:var(--muted);font-size:13px}
.hero .lbl{color:var(--muted);font-size:14px}
.hero .big{font-size:36px;font-weight:800;letter-spacing:-.03em;margin:2px 0 4px}
.hero .big.neg{color:var(--bad)}
.hero .eq{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.stat .k{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .k i{width:8px;height:8px;border-radius:50%;display:inline-block}
.stat .v{font-size:19px;font-weight:700;margin-top:4px}
.stat .d{font-size:12px;margin-top:2px;color:var(--muted)}
.up{color:var(--good)} .down{color:var(--bad)}
.alert{background:var(--warn-soft);border-radius:16px;padding:14px 16px;margin-bottom:14px;font-size:14px;color:#6b4a10;display:flex;gap:10px}
.alert b{color:#4a330a}

/* progress */
.goal{margin-bottom:16px}.goal:last-child{margin-bottom:0}
.goal .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.goal .row span:last-child{color:var(--muted)}
.bar{height:10px;background:#e8f1ef;border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--teal),var(--mint));border-radius:99px;transition:width .4s}
.goal .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}

.cat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin-bottom:12px;font-size:14px}
.cat .bar{grid-column:1/3;height:8px}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#e8f1ef;margin:6px 0 10px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* lists */
.seg{display:flex;background:#e6eeec;border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--deep);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item:active{background:#f6faf9}
.item .ic{width:38px;height:38px;border-radius:12px;background:var(--mint-soft);display:grid;place-items:center;font-size:18px;flex:none}
.item .tx{flex:1;min-width:0}
.item .t1{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:12.5px;color:var(--muted);margin-top:1px}
.item .val{font-weight:700;font-size:15px;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:#eef3f2;color:var(--muted);margin-left:4px}
.tag.cr{background:#fde8e8;color:#9b1c1c}
.tag.auto{background:var(--mint-soft);color:var(--teal)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid #b9cbc8;display:grid;place-items:center;flex:none;color:#fff;font-size:15px}
.check.on{background:var(--teal);border-color:var(--teal)}
.empty{text-align:center;color:var(--muted);padding:28px 16px;font-size:14px}
.empty .e{font-size:30px;margin-bottom:6px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:700;font-size:15px;text-align:center}
.btn.pri{background:var(--deep);color:#fff}
.btn.sec{background:#e6eeec;color:var(--deep)}
.btn.dan{background:#fde8e8;color:#9b1c1c}
.btn+.btn{margin-top:10px}
.totalrow{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:0 4px 12px}
.totalrow b{color:var(--ink)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;
  padding:6px 8px calc(6px + var(--safe-b));z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:#8aa09d;padding:6px 0}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--deep)}
nav .fab{flex:none;width:54px;height:54px;border-radius:18px;background:var(--deep);color:#fff;margin:-22px 6px 0;
  box-shadow:0 8px 20px rgba(11,59,58,.35);display:grid;place-items:center}
nav .fab svg{width:26px;height:26px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,30,29,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px 18px calc(20px + var(--safe-b));
  max-height:92vh;overflow:auto;animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#d5dfdd;margin:0 auto 12px}
.sheet h2{margin:0 0 14px;font-size:19px;letter-spacing:-.02em}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f input,.f select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fbfdfc;font-size:16px;outline:none;appearance:none;-webkit-appearance:none}
.f input:focus,.f select:focus{border-color:var(--mint);background:#fff}
.f .money{font-size:22px;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 12px;border-radius:99px;background:#eef3f2;font-size:14px;font-weight:600;color:var(--muted)}
.chips button.on{background:var(--deep);color:#fff}
.switch{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:15px}
.tg{width:48px;height:28px;border-radius:99px;background:#cfdcd9;position:relative;transition:.2s;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on{background:var(--teal)}.tg.on::after{left:23px}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}

/* onboarding */
.onb{min-height:100vh;background:var(--deep);color:#fff;padding:calc(var(--safe-t) + 40px) 22px 30px}
.onb .in{max-width:480px;margin:0 auto}
.onb h1{font-size:30px;letter-spacing:-.03em;margin:18px 0 6px;line-height:1.15}
.onb p{opacity:.75;margin:0 0 24px}
.onb .f label{color:rgba(255,255,255,.75)}
.onb .f input,.onb .f select{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:#fff}
.onb .f select option{color:#000}
.onb .btn.pri{background:var(--mint);color:var(--deep);margin-top:20px}
.onb .logo{width:56px;height:56px;border-radius:16px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
