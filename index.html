<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tino Finanças</title>
<meta name="theme-color" content="#0a3f2d" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06261b" media="(prefers-color-scheme: dark)">
<meta name="description" content="Organize entradas, gastos, contas, reservas e metas mês a mês.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tino">
<style>
:root{
  --deep:#0a3f2d; --deep2:#0d5a40; --teal:#0d9668; --mint:#34d399; --mint-soft:#dcf5ea;
  --bg:#f3f6f4; --surface:#fff; --line:#e1eae5; --ink:#0f1e1a; --muted:#5a6e67;
  --good:#0d9668; --bad:#dc4545; --warn:#b7791f; --warn-soft:#fdf3e1;
  --r:20px; --shadow:0 1px 2px rgba(10,63,45,.05),0 8px 24px rgba(10,63,45,.07);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --header:#0a3f2d; --accent-ink:#0a3f2d; --pri-bg:#0a3f2d; --pri-ink:#fff;
  --gold:#fcd34d; --gold2:#e9a91b; --gold-ink:#0a3f2d;
  --surface-2:#f3f7f5; --field:#fafcfb; --track:#e9f0ec; --seg:#e4ece8;
  --nav-bg:rgba(255,255,255,.94); --nav-ink:#7d918a; --fab-shadow:0 10px 24px rgba(233,169,27,.45);
  --danger-soft:#fde8e8; --danger-ink:#8f1c1c; --warn-ink:#6b4a10; --info-soft:#ebf6f0; --info-ink:#0a3f2d;
  --check:#b6c9c0; --grab:#d3ddd8; --tg-off:#cddad3; --grid:#e6eee9; --axis:#c6d4cd; --cat-dim:#9ccdb5; --dot-no:#c0d1c8;
  --tour-bg:#0a3f2d; --tour-ink:#fff; --tour-muted:rgba(255,255,255,.82); --tour-accent:#fcd34d; --tour-btn:#fcd34d; --tour-btn-ink:#0a3f2d; --tour-sec:rgba(255,255,255,.14);
  --heat1:#d8f3e5; --heat2:#9fe0bf; --heat3:#3dbb85; --heat4:#0b7a52; --heat-ink4:#fff;
  --ent:#0d9668; --sai:#e8673a; --pend:#f2c1c3; --overlay:rgba(6,30,21,.48); --toast-bg:#0f1e1a; --toast-ink:#fff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#06261b; --deep2:#0a3a29; --teal:#2fbf86; --mint:#34d399; --mint-soft:#143a2b;
  --bg:#07120e; --surface:#101c17; --line:#1d2d26; --ink:#e6f1ec; --muted:#8ea79c;
  --good:#3ccf92; --bad:#f2676b; --warn:#e0a43a; --warn-soft:#33290f;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  --header:#06261b; --accent-ink:#9ee9c6; --pri-bg:#34d399; --pri-ink:#04261a;
  --gold:#fcd34d; --gold2:#e9a91b; --gold-ink:#06261b;
  --surface-2:#16241e; --field:#14211b; --track:#1f2f28; --seg:#17251f;
  --nav-bg:rgba(16,28,23,.94); --nav-ink:#6c857a; --fab-shadow:0 10px 24px rgba(0,0,0,.5);
  --danger-soft:#3b1c1e; --danger-ink:#f5a5a7; --warn-ink:#f0c879; --info-soft:#12302a; --info-ink:#a8ecd0;
  --check:#47605a; --grab:#36483f; --tg-off:#36483f; --grid:#1c2b25; --axis:#36483f; --cat-dim:#2b5c48; --dot-no:#47605a;
  --tour-bg:#effaf4; --tour-ink:#06261b; --tour-muted:#3a5449; --tour-accent:#0d9668; --tour-btn:#0a3f2d; --tour-btn-ink:#fff; --tour-sec:#d9efe3;
  --heat1:#123126; --heat2:#1b5a40; --heat3:#2a9b6c; --heat4:#45d098; --heat-ink4:#04261a;
  --ent:#2fbf86; --sai:#e0632f; --pend:#6b3438; --overlay:rgba(0,0,0,.6); --toast-bg:#e6f1ec; --toast-ink:#0f1e1a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --deep:#06261b; --deep2:#0a3a29; --teal:#2fbf86; --mint:#34d399; --mint-soft:#143a2b;
  --bg:#07120e; --surface:#101c17; --line:#1d2d26; --ink:#e6f1ec; --muted:#8ea79c;
  --good:#3ccf92; --bad:#f2676b; --warn:#e0a43a; --warn-soft:#33290f;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  --header:#06261b; --accent-ink:#9ee9c6; --pri-bg:#34d399; --pri-ink:#04261a;
  --gold:#fcd34d; --gold2:#e9a91b; --gold-ink:#06261b;
  --surface-2:#16241e; --field:#14211b; --track:#1f2f28; --seg:#17251f;
  --nav-bg:rgba(16,28,23,.94); --nav-ink:#6c857a; --fab-shadow:0 10px 24px rgba(0,0,0,.5);
  --danger-soft:#3b1c1e; --danger-ink:#f5a5a7; --warn-ink:#f0c879; --info-soft:#12302a; --info-ink:#a8ecd0;
  --check:#47605a; --grab:#36483f; --tg-off:#36483f; --grid:#1c2b25; --axis:#36483f; --cat-dim:#2b5c48; --dot-no:#47605a;
  --tour-bg:#effaf4; --tour-ink:#06261b; --tour-muted:#3a5449; --tour-accent:#0d9668; --tour-btn:#0a3f2d; --tour-btn-ink:#fff; --tour-sec:#d9efe3;
  --heat1:#123126; --heat2:#1b5a40; --heat3:#2a9b6c; --heat4:#45d098; --heat-ink4:#04261a;
  --ent:#2fbf86; --sai:#e0632f; --pend:#6b3438; --overlay:rgba(0,0,0,.6); --toast-bg:#e6f1ec; --toast-ink:#0f1e1a;
  color-scheme:dark;
}
@font-face{font-family:Inter;font-weight:400 800;font-display:swap;src:url(fonts/inter-var.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:700;font-display:swap;src:url(fonts/poppins-700.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:800;font-display:swap;src:url(fonts/poppins-800.woff2) format('woff2')}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* header */
.top{background:radial-gradient(110% 120% at 92% -10%,rgba(52,211,153,.30),transparent 55%),radial-gradient(60% 80% at 0% 120%,rgba(252,211,77,.10),transparent 60%),var(--header);color:#fff;padding:calc(var(--safe-t) + 18px) 18px 16px;position:relative}
.top .hello{font-family:Poppins,Inter,sans-serif;font-size:22px;font-weight:700;letter-spacing:-.01em}
.top .sub{opacity:.72;font-size:14px;margin-top:2px}
.top.hero-top{padding-bottom:64px}.top.hero-top+main{margin-top:-48px}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-top:16px;
  background:rgba(255,255,255,.08);border-radius:14px;padding:4px}
.monthbar button{width:42px;height:38px;border-radius:10px;color:#fff;font-size:20px}
.monthbar button:active{background:rgba(255,255,255,.12)}
.monthbar .m{font-weight:600}
main{max-width:640px;margin:14px auto 0;padding:0 14px calc(96px + var(--safe-b));position:relative}

/* cards */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-family:Poppins,Inter,sans-serif;font-size:15.5px;font-weight:700;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center}
.card h3 small{font-weight:500;color:var(--muted);font-size:13px}
.hero .lbl{color:var(--muted);font-size:14px}
.hero .big{font-family:Poppins,Inter,sans-serif;font-size:38px;font-weight:800;letter-spacing:-.02em;margin:2px 0 4px}
.hero .big.neg{color:var(--bad)}
.hero .eq{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.stat .k{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .k i{width:8px;height:8px;border-radius:50%;display:inline-block}
.stat .v{font-family:Poppins,Inter,sans-serif;font-size:18px;font-weight:700;margin-top:4px}
.stat .d{font-size:12px;margin-top:2px;color:var(--muted)}
.up{color:var(--good)} .down{color:var(--bad)}
.alert{background:var(--warn-soft);border-radius:16px;padding:14px 16px;margin-bottom:14px;font-size:14px;color:var(--warn-ink);display:flex;gap:10px}
.alert b{color:var(--warn-ink)}

/* progress */
.goal{margin-bottom:16px}.goal:last-child{margin-bottom:0}
.goal .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.goal .row span:last-child{color:var(--muted)}
.bar{height:10px;background:var(--track);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--teal),var(--mint));border-radius:99px;transition:width .4s}
.goal .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}

.cat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin-bottom:12px;font-size:14px}
.cat .bar{grid-column:1/3;height:8px}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--track);margin:6px 0 10px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* lists */
.seg{display:flex;background:var(--seg);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item:active{background:var(--surface-2)}
.item .ic{width:38px;height:38px;border-radius:12px;background:var(--mint-soft);display:grid;place-items:center;font-size:18px;flex:none}
.item .tx{flex:1;min-width:0}
.item .t1{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:12.5px;color:var(--muted);margin-top:1px}
.item .val{font-weight:700;font-size:15px;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--track);color:var(--muted);margin-left:4px}
.tag.cr{background:var(--danger-soft);color:var(--danger-ink)}
.tag.auto{background:var(--mint-soft);color:var(--teal)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--check);display:grid;place-items:center;flex:none;color:#fff;font-size:15px}
.check.on{background:var(--teal);border-color:var(--teal)}
.empty{text-align:center;color:var(--muted);padding:28px 16px;font-size:14px}
.empty .e{font-size:30px;margin-bottom:6px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:700;font-size:15px;text-align:center}
.btn.pri{background:var(--pri-bg);color:var(--pri-ink)}
.btn.sec{background:var(--seg);color:var(--accent-ink)}
.btn.dan{background:var(--danger-soft);color:var(--danger-ink)}
.btn+.btn{margin-top:10px}
.totalrow{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:0 4px 12px}
.totalrow b{color:var(--ink)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav-bg);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;
  padding:6px 8px calc(6px + var(--safe-b));z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--nav-ink);padding:6px 0}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--accent-ink)}
nav .fab{flex:none;width:56px;height:56px;border-radius:19px;background:linear-gradient(140deg,var(--gold),var(--gold2));color:var(--gold-ink);margin:-24px 6px 0;
  box-shadow:var(--fab-shadow);display:grid;place-items:center}
nav .fab svg{width:26px;height:26px}

/* sheet */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:40;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex;animation:fade .15s}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px 18px calc(20px + var(--safe-b));
  max-height:92vh;overflow:auto;animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--grab);margin:0 auto 12px}
.sheet h2{margin:0 0 14px;font-family:Poppins,Inter,sans-serif;font-size:19.5px;letter-spacing:-.01em}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f input,.f select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);font-size:16px;outline:none;appearance:none;-webkit-appearance:none}
.f input:focus,.f select:focus{border-color:var(--mint);background:var(--surface)}
.f textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);font:inherit;font-size:16px;color:inherit;outline:none;resize:vertical}
.f textarea:focus{border-color:var(--mint);background:var(--surface)}
a.btn{text-decoration:none}
.estrelas{display:flex;justify-content:center;gap:6px;margin:4px 0 14px}
.estrelas button{font-size:38px;line-height:1;color:var(--track);padding:2px 4px}
.estrelas button.on{color:#f5b82e}
.aut{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);margin:2px 0 16px;cursor:pointer}
.aut input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--teal)}
.link-sutil{display:block;margin:12px auto 0;font-size:13.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.ajuda details{border-bottom:1px solid var(--line);padding:2px 0}
.ajuda summary{font-weight:600;font-size:15px;padding:12px 0;cursor:pointer;list-style:none}
.ajuda summary::-webkit-details-marker{display:none}
.ajuda p{margin:0 0 14px;font-size:14.5px;color:var(--muted);line-height:1.5}
.ajuda-t{font-size:16px;margin:20px 0 12px}
.opcoes{display:flex;flex-wrap:wrap;gap:8px}
.opcoes button{padding:9px 13px;border-radius:99px;background:var(--track);font-size:14px;font-weight:600;color:var(--muted)}
.opcoes button.on{background:var(--pri-bg);color:var(--pri-ink)}
/* tela inicial 2.0 */
.hero2 .h2-lbl{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:14px;font-weight:600}
.hero2 .st{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.hero2 .st.ok{background:var(--mint-soft);color:var(--teal)}
.hero2 .st.atencao{background:var(--warn-soft);color:var(--warn-ink)}
.hero2 .st.ruim{background:var(--danger-soft);color:var(--danger-ink)}
.hero2 .big{font-size:44px;margin:4px 0 2px}
.hero2 .h2-sub{font-size:14.5px;color:var(--muted)}
.hero2 .h2-sub b{color:var(--ink)}
.ritmo{margin:16px 0 4px}
.ritmo-t{position:relative;height:12px;border-radius:99px;background:var(--track)}
.ritmo-f{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--mint))}
.ritmo-f.atencao{background:linear-gradient(90deg,var(--gold2),var(--gold))}
.ritmo-f.ruim{background:linear-gradient(90deg,#c43a3a,var(--bad))}
.ritmo-m{position:absolute;top:-5px;width:3px;height:22px;margin-left:-1.5px;border-radius:2px;background:var(--ink);opacity:.75}
.ritmo-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:8px}
.ritmo-l b{color:var(--ink)}
.rapidas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.rapidas button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 4px 10px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--accent-ink);line-height:1.15;text-align:center}
.rapidas button span{font-size:21px;line-height:1}
.rapidas button:active{transform:scale(.97)}
details.como{margin-top:12px}
details.como summary{font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;list-style:none}
details.como summary::-webkit-details-marker{display:none}
details.como summary::before{content:"ⓘ  "}
details.como .eq{margin-top:6px}
.neg{color:var(--bad)}
.ver-mais{display:block;width:100%;margin:2px 0 12px;padding:10px;border-radius:12px;background:var(--surface-2);font-size:13.5px;font-weight:600;color:var(--accent-ink)}
.semana-card{border:0}
/* fluxo do dinheiro */
svg.fluxo{width:100%;height:auto;display:block;margin:4px 0 10px;overflow:visible}
.fluxo .fx-n{font-size:12.5px;font-weight:700;fill:var(--ink)}
.fluxo .fx-v{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
/* minha semana */
.sem-total{display:flex;flex-direction:column;gap:2px;margin-bottom:16px}
.sem-total span{font-size:13.5px;color:var(--muted)}
.sem-total b{font-family:Poppins,Inter,sans-serif;font-size:32px;letter-spacing:-.02em}
.sem-total small{font-size:13px;font-weight:600}
.sem-barras{display:flex;align-items:flex-end;gap:8px;height:150px;margin-bottom:16px}
.sb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.sb-b{width:100%;max-width:30px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--mint),var(--teal))}
.sb-v{font-size:10px;color:var(--muted)}
.sb-d{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:capitalize}
.sem-fatos{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.sem-fatos>div{display:flex;gap:10px;align-items:center;font-size:14.5px;background:var(--surface-2);border-radius:12px;padding:10px 12px}
/* patrimônio */
.pat-total{font-family:Poppins,Inter,sans-serif;font-size:32px;font-weight:800;letter-spacing:-.02em;margin:-2px 0 12px}
.pat-cols{display:grid;grid-template-columns:1fr;gap:8px}
.pat-cols>div{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.pat-cols small{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.pat-l{display:flex;justify-content:space-between;gap:6px;font-size:14px;padding:3px 0}
.pat-l b{font-weight:700}
.pat-hist{display:flex;align-items:flex-end;gap:10px;height:90px;margin-top:14px}
.ph{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.ph-b{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--mint),var(--teal))}
.ph-b.neg{background:linear-gradient(180deg,#f29b9b,var(--bad))}
.ph-d{font-size:11.5px;color:var(--muted);font-weight:600}
/* organizar outros */
.org-lista{display:flex;flex-direction:column;gap:14px}
.org-item{background:var(--surface-2);border-radius:16px;padding:12px}
.org-t{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;margin-bottom:10px}
.org-t span{color:var(--muted);white-space:nowrap}
.org-cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.org-cats::-webkit-scrollbar{display:none}
.org-cats button{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;width:64px;padding:8px 2px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:20px}
.org-cats small{font-size:10px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58px}
.renda-card .dica{margin-top:10px}
.nuvem{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.nuvem h4{margin:0 0 8px;font-size:15px}
.f .money{font-size:22px;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 12px;border-radius:99px;background:var(--track);font-size:14px;font-weight:600;color:var(--muted)}
.chips button.on{background:var(--pri-bg);color:var(--pri-ink)}
.switch{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:15px}
.tg{width:48px;height:28px;border-radius:99px;background:var(--tg-off);position:relative;transition:.2s;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on{background:var(--teal)}.tg.on::after{left:23px}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}

/* onboarding */
.onb{min-height:100vh;background:var(--header);color:#fff;padding:calc(var(--safe-t) + 40px) 22px 30px}
.onb .in{max-width:480px;margin:0 auto}
.onb h1{font-size:30px;letter-spacing:-.03em;margin:18px 0 6px;line-height:1.15}
.onb p{opacity:.75;margin:0 0 24px}
.onb .slogan{opacity:1;margin:-2px 0 18px;font-weight:700;color:#fcd34d}
.onb .f label{color:rgba(255,255,255,.75)}
.onb .f input,.onb .f select{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:#fff}
.onb .f select option{color:#000}
.onb .btn.pri{background:var(--mint);color:#062e2b;margin-top:20px}
.onb .logo{width:56px;height:56px;border-radius:16px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-ink);
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}

/* alertas */
.alert.info{background:var(--info-soft);color:var(--info-ink)}
.alert.info b{color:var(--info-ink)}
button.alert{width:100%;text-align:left;font:inherit;font-size:14px}
.alert.warnbox{background:var(--warn-soft)}
.alert.crit{background:var(--danger-soft);color:var(--danger-ink)}.alert.crit b{color:var(--danger-ink)}
.tag.warn{background:var(--warn-soft);color:var(--warn-ink)}
.muted{color:var(--muted);font-weight:400}

/* previsão do mês */
.prev{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.prev div{display:flex;flex-direction:column;gap:1px}
.prev span{font-size:13px;color:var(--muted)}
.prev b{font-size:19px;letter-spacing:-.02em}
.prev b.neg{color:var(--bad)}
.prev small{font-size:12px;color:var(--muted)}
.hero .eq+.eq{margin-top:4px}
.prev+.eq{margin-top:10px}

/* gráfico de categorias (barras horizontais) */
.hbars{display:flex;flex-direction:column;gap:4px}
.hb{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center;padding:7px 4px;border-radius:10px;width:100%;text-align:left;font-size:14px}
.hb:active{background:var(--surface-2)}
.hb-l{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-e{font-size:15px}
.hb-v{font-weight:600}.hb-v small{color:var(--muted);font-weight:500;margin-left:2px}
.hb-t{grid-column:1/3;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.hb-t span{display:block;height:100%;border-radius:4px;background:var(--teal)}
.ess{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.dot.ok{background:var(--teal)}.dot.no{background:var(--dot-no)}

/* orçamentos */
.meter{display:block;width:100%;text-align:left;margin-bottom:14px;font-size:14px}
.meter .row{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.meter .row span{color:var(--muted)}
.meter .bar{display:block}
.meter .bar span{display:block;height:100%;border-radius:99px;background:var(--teal)}
.meter.warn .bar span{background:var(--warn)}
.meter.crit .bar span{background:var(--bad)}
.meter .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}
.meter.warn .foot span:first-child{color:var(--warn-ink);font-weight:600}
.meter.crit .foot span:first-child{color:var(--bad);font-weight:600}
.orclist{display:flex;flex-direction:column}
.orc{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.orc .lbl{display:flex;flex-direction:column;font-size:15px}
.orc .lbl small{font-size:12px;color:var(--muted)}
.orc input{width:120px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);font-size:16px;text-align:right;outline:none}
.orc input:focus{border-color:var(--mint)}

/* gráfico de evolução */
.evo{width:100%;height:auto;display:block;overflow:visible}
.evo .grid-l{stroke:var(--grid);stroke-width:1}
.evo .axis-l{stroke:var(--axis);stroke-width:1}
.evo .b-ent{fill:var(--ent)}
.evo .b-sai{fill:var(--sai)}
.evo .hit{fill:transparent;cursor:pointer}
.evo .evo-g.on .hit{fill:var(--surface-2)}
.evo .lbl-m{font-size:11px;fill:var(--muted);font-family:inherit}
.evo .evo-g.on .lbl-m{fill:var(--ink);font-weight:700}
.evo .b-cat{fill:var(--cat-dim)}.evo .b-cat.on{fill:var(--teal)}
.evo .lim-l{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:4 3}
.limkey{display:inline-block;width:12px;border-top:2px dashed var(--bad);margin-right:5px;vertical-align:3px}
.evo .lbl-v{font-size:10.5px;fill:var(--muted);font-weight:600}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sw.ent{background:var(--ent)}.sw.sai{background:var(--sai)}
.evo-info{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px;margin-top:8px}
.evo-info>b{color:var(--ink);width:100%}
.evo-info span b{color:var(--ink)}.evo-info b.neg{color:var(--bad)}

/* detalhe da categoria */
.kpis{display:flex;gap:10px;margin-bottom:12px}
.kpis div{flex:1;background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.kpis span{font-size:12px;color:var(--muted)}.kpis b{font-size:16px}
.sub-h{font-size:14px;margin:16px 0 8px}
.list.flat{box-shadow:none;border:1px solid var(--line)}
.inline{display:flex;gap:8px}.inline input{flex:1}.inline .btn{width:auto;padding:0 20px}
.gprev{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.35}
.gprev b{color:var(--ink)}.gprev.ok{color:var(--good);font-weight:600}

/* formulário de gasto rápido */
.seg.sm{margin:0 0 14px}.seg.sm button{padding:7px 4px;font-size:13px}
.f .money.big{font-size:30px;text-align:center;padding:14px;letter-spacing:-.02em}
.chips.rec{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.rec::-webkit-scrollbar{display:none}
.chips.rec button{white-space:nowrap;background:var(--mint-soft);color:var(--accent-ink)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.catgrid button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;background:var(--surface-2);font-size:11px;font-weight:600;color:var(--muted);line-height:1.15;text-align:center;border:1.5px solid transparent}
.catgrid button span{font-size:20px}
.catgrid button.on{background:var(--mint-soft);border-color:var(--teal);color:var(--accent-ink)}
details.mais{margin:2px 0 14px}
.sheet>.btn.pri{position:sticky;bottom:calc(-20px - var(--safe-b));box-shadow:0 -10px 16px 6px var(--surface);z-index:2}
details.mais summary{font-size:14px;font-weight:600;color:var(--teal);cursor:pointer;padding:6px 0 10px;list-style:none}
details.mais summary::before{content:"+ "}
details.mais[open] summary::before{content:"− "}

/* lembrete de backup */
.alert.backup .acts,.alert.conectado .acts{display:flex;gap:8px;margin-top:10px}
.alert.backup .acts .btn,.alert.conectado .acts .btn{width:auto;flex:1;padding:10px;font-size:14px;margin:0}

/* instalar */
.inst-atual{background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:10px 0 4px;font-size:14px}
.inst-outro{font-size:14px;margin:6px 0 12px}
.passos{margin:6px 0 0;padding-left:20px;color:var(--ink);line-height:1.45}
.passos li{margin-bottom:4px}
.kbd{display:inline-block;min-width:22px;text-align:center;padding:0 5px;border-radius:6px;background:var(--track);font-weight:700}

/* dica de instalação no iPhone (tela de acesso) */
.dica-ios{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:14px 16px;margin-top:6px;font-size:14.5px}
.dica-ios ol{margin:8px 0 8px;padding-left:20px;line-height:1.5}
.dica-ios small{opacity:.75;font-size:12.5px}
.dica-ios .kbd{background:rgba(255,255,255,.18)}

.onb .btn.link{background:none;color:rgba(255,255,255,.8);font-weight:500;font-size:14px;margin-top:14px}
.onb .btn.link b{color:#fff;text-decoration:underline}

.btn.mini{width:auto;padding:8px 12px;font-size:13px;border-radius:10px;flex:none}

/* tutorial */
#tour{position:fixed;inset:0;z-index:100}
#tour .t-dim{position:absolute;inset:0;background:rgba(4,14,13,.66)}
#tour .t-spot{position:absolute;border-radius:16px;box-shadow:0 0 0 9999px rgba(4,14,13,.66);outline:3px solid #2dd4bf;outline-offset:1px;transition:all .25s ease;pointer-events:none}
#tour .t-box{position:absolute;left:16px;right:16px;max-width:380px;margin:0 auto;background:var(--tour-bg);color:var(--tour-ink);border-radius:18px;padding:16px 18px;box-shadow:0 14px 36px rgba(0,0,0,.4);animation:fade .2s}
#tour .t-passo{font-size:12px;font-weight:700;color:var(--tour-accent);letter-spacing:.02em}
#tour h4{margin:4px 0 6px;font-size:17px;letter-spacing:-.01em;color:var(--tour-ink)}
#tour p{margin:0;font-size:14.5px;color:var(--tour-muted);line-height:1.45}
#tour p b{color:var(--tour-ink)}
#tour .t-acts{display:flex;gap:8px;align-items:center;margin-top:14px}
#tour .pular{margin-right:auto;color:var(--tour-muted);font-size:14px;font-weight:600;padding:8px 2px}
#tour .btn{width:auto;padding:10px 16px;font-size:14px;margin:0}
#tour .btn.pri{background:var(--tour-btn);color:var(--tour-btn-ink)}
#tour .btn.sec{background:var(--tour-sec);color:var(--tour-ink)}

/* atualização */
.upd{position:fixed;left:12px;right:12px;bottom:calc(84px + var(--safe-b));max-width:520px;margin:0 auto;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--tour-bg);color:var(--tour-ink);
  border-radius:14px;padding:10px 10px 10px 16px;box-shadow:0 10px 26px rgba(0,0,0,.28);font-size:14.5px;font-weight:600;animation:up .25s ease-out}
.upd button{background:var(--tour-btn);color:var(--tour-btn-ink);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px}
.novidades{margin:0 0 16px;padding-left:20px;line-height:1.5;font-size:15px}
.novidades li{margin-bottom:8px}

/* cofrinhos */
.goal.cof{display:block;width:100%;text-align:left;font-size:14px;padding:4px 0}
.goal.cof .row,.goal.cof .foot{display:flex}
.goal.cof .bar{display:block}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--mint));border-radius:99px;transition:width .4s}
.goal.cof .gprev{display:block}
.chips.emo button{font-size:20px;padding:6px 10px}
.chips .novo-cof{background:none;border:1.5px dashed var(--line);color:var(--teal)}

/* lançar por frase */
.frase{position:relative;margin-bottom:6px}
.frase input{width:100%;padding:12px 48px 12px 14px;border:1.5px dashed var(--mint);border-radius:14px;background:var(--mint-soft);color:var(--ink);font-size:15px;outline:none}
.frase input::placeholder{color:var(--accent-ink);opacity:.75}
.frase .mic{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:11px;font-size:18px;background:var(--surface)}
.frase .mic.gravando{background:var(--bad);animation:pulsar 1s infinite}
@keyframes pulsar{50%{opacity:.6}}
.frase-info{font-size:13px;color:var(--muted);min-height:4px;margin:0 2px 10px}
.frase-info b{color:var(--ink)}

/* sequência e conquistas */
.top .hello{display:flex;align-items:center;gap:10px}
.streak{font-size:14px;font-weight:700;background:rgba(255,255,255,.14);color:#fff;border-radius:99px;padding:3px 10px}
.seqbox{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.seqbox .fogo{font-size:28px}
.seqbox b{display:block;font-size:16px}.seqbox small{color:var(--muted);font-size:12.5px}
.medalhas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.med{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:10px 4px;border-radius:14px;background:var(--surface-2);opacity:.55}
.med .m-e{font-size:26px;filter:grayscale(1)}
.med b{font-size:12px;line-height:1.2}
.med small{font-size:10.5px;color:var(--muted);line-height:1.2}
.med.on{opacity:1;background:var(--mint-soft)}.med.on .m-e{filter:none}
#conq{position:fixed;left:12px;right:12px;bottom:calc(84px + var(--safe-b));max-width:440px;margin:0 auto;z-index:70;text-align:left;
  background:var(--tour-bg);color:var(--tour-ink);border-radius:18px;padding:14px 16px;box-shadow:0 14px 34px rgba(0,0,0,.35);
  display:flex;flex-direction:column;gap:8px;animation:pop .35s cubic-bezier(.2,1.4,.4,1);transition:opacity .4s,transform .4s}
#conq.sai{opacity:0;transform:translateY(20px)}
#conq .c-top{font-size:13px;font-weight:800;color:var(--tour-accent);letter-spacing:.02em}
#conq .c-item{display:flex;gap:12px;align-items:center}
#conq .c-e{font-size:30px}
#conq b{display:block;font-size:15.5px}#conq small{color:var(--tour-muted);font-size:13px}
#conq .c-mais{font-size:12.5px;color:var(--tour-muted)}
@keyframes pop{from{transform:scale(.85) translateY(30px);opacity:0}}

/* retrospectiva */
.retro-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:14px;padding:14px 16px;border-radius:18px;
  background:linear-gradient(120deg,#0b3b3a,#0f766e);color:#fff;box-shadow:var(--shadow)}
.retro-card .rc-e{font-size:30px}
.retro-card b{display:block;font-size:15px}.retro-card small{opacity:.8;font-size:13px}
.retro-card .rc-seta{margin-left:auto;font-size:26px;opacity:.7}
#retro{position:fixed;inset:0;z-index:120;color:#fff;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 14px) 22px calc(var(--safe-b) + 24px);
  background:linear-gradient(160deg,#0b3b3a,#0f766e);user-select:none;-webkit-user-select:none;transition:background .4s}
#retro.r2{background:linear-gradient(160deg,#123a5c,#1f6fb2)}
#retro.r3{background:linear-gradient(160deg,#5b2a86,#b04ab0)}
#retro.r4{background:linear-gradient(160deg,#7a2b12,#e0662d)}
#retro.r5{background:linear-gradient(160deg,#0f4d3a,#1baf7a)}
#retro.r6{background:linear-gradient(160deg,#3b2a12,#c98500)}
#retro.r7{background:linear-gradient(160deg,#0b3b3a,#14b8a6)}
.r-barras{display:flex;gap:4px}
.r-barras span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3)}
.r-barras span.cheia,.r-barras span.atual{background:#fff}
.r-x{position:absolute;right:12px;top:calc(var(--safe-t) + 22px);width:40px;height:40px;color:#fff;font-size:28px;opacity:.85}
.r-conteudo{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:460px;margin:0 auto;width:100%;animation:fade .35s}
.r-conteudo small{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
.r-conteudo h2{font-size:42px;line-height:1.05;letter-spacing:-.03em;margin:10px 0 12px}
.r-conteudo p{font-size:18px;line-height:1.45;opacity:.92;margin:0 0 10px}
.r-emoji{font-size:84px;margin:18px 0 0}.r-emoji.grande{font-size:120px}
.r-lin{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(255,255,255,.2);padding:16px 0;font-size:18px}
.r-lin b{font-size:28px;letter-spacing:-.02em}
.r-dest{margin-top:18px!important;font-size:20px!important}
.r-sub{font-size:15px!important;opacity:.75!important}
.r-dica{margin-top:40px;font-size:14px;opacity:.7}
.r-acts{display:flex;gap:10px;margin-top:26px}
.r-acts .btn{flex:1;margin:0}
.r-acts .btn.pri{background:#fff;color:#0b3b3a}
.r-acts .btn.sec{background:rgba(255,255,255,.18);color:#fff}
.r-priv{display:block;margin-top:12px;font-size:12.5px;opacity:.7;text-align:center}

/* esconder valores */
.olho{position:absolute;right:12px;top:calc(var(--safe-t) + 14px);width:40px;height:40px;border-radius:12px;color:#fff;display:grid;place-items:center;background:rgba(255,255,255,.1)}
.olho svg{width:22px;height:22px}
.top .hello{padding-right:48px}

/* trava com senha */
#trava{position:fixed;inset:0;z-index:200;background:var(--header);color:#fff;display:flex;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 20px) 20px calc(var(--safe-b) + 20px)}
#trava .t-in{width:100%;max-width:320px;text-align:center}
#trava .logo{width:56px;height:56px;border-radius:16px}
#trava h2{font-size:20px;margin:16px 0 4px}
#trava .t-msg{min-height:20px;font-size:14px;color:#fca5a5;margin:0 0 14px}
.pontos{display:flex;justify-content:center;gap:16px;margin-bottom:26px}
.pontos span{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
.pontos span.on{background:#fff;border-color:#fff}
.pontos.treme{animation:treme .4s}
@keyframes treme{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;justify-items:center}
.teclado button{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:28px;font-weight:500}
.teclado button:active{background:rgba(255,255,255,.28)}
.teclado button[data-pin="apagar"],.teclado button[data-pin="bio"]{background:none;font-size:24px}
#trava .t-link{margin-top:22px;color:rgba(255,255,255,.8);font-size:14px;font-weight:600;padding:8px}
body.privado #app,body.privado .overlay{filter:blur(18px)}

/* assinaturas */
.assin-tot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.assin-tot div{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.assin-tot b{font-size:19px;letter-spacing:-.02em}.assin-tot span{font-size:12.5px;color:var(--muted)}
.assin-mini{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.assin-mini span{font-size:13px;background:var(--track);border-radius:99px;padding:5px 10px}
.assin-ign{font-size:12px;color:var(--muted);text-decoration:underline;padding:4px 0 0}

/* calendário */
.seg button{white-space:nowrap}
.cal-card{padding:14px}
.cal-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.cal-kpis div{background:var(--surface-2);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.cal-kpis span{font-size:11.5px;color:var(--muted)}.cal-kpis b{font-size:15px}.cal-kpis small{font-size:11px;color:var(--muted);font-weight:500}
.cal-sem,.cal-grade{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-sem span{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding-bottom:4px}
.cal-dia{aspect-ratio:1/1.08;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 1px 3px;position:relative;border:2px solid transparent;min-width:0}
.cal-dia .cal-n{font-size:12.5px;font-weight:700}
.cal-dia .cal-v{font-size:9.5px;font-weight:600;letter-spacing:-.02em;line-height:1.1;white-space:nowrap;overflow:hidden;max-width:100%}
.cal-dia .cal-dots{display:flex;gap:2px;margin-top:auto;height:6px}
.cal-dia.h1{background:var(--heat1)}.cal-dia.h2{background:var(--heat2)}.cal-dia.h3{background:var(--heat3)}
.cal-dia.h4{background:var(--heat4);color:var(--heat-ink4)}
.cal-dia.futuro{background:none;border:1.5px dashed var(--line)}
.cal-dia.futuro .cal-n{color:var(--muted);font-weight:600}
.cal-dia.hoje{border-color:var(--ink)}
.cal-dia.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--teal)}
.cal-dots i,.cal-leg i[class^="dot"]{display:inline-block;width:6px;height:6px;border-radius:50%}
.dot-ent{background:var(--good)}.dot-venc{background:var(--bad)}.dot-paga{background:var(--muted)}
.cal-leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted);margin-top:12px;align-items:center}
.cal-leg span{display:inline-flex;align-items:center;gap:5px}
.cal-esc{margin-left:auto}
.cal-esc i{display:inline-block;width:12px;height:12px;border-radius:3px}
.cal-esc .h1{background:var(--heat1)}.cal-esc .h2{background:var(--heat2)}.cal-esc .h3{background:var(--heat3)}.cal-esc .h4{background:var(--heat4)}

/* importar extrato */
.imp-lista .item.imp{gap:10px;padding:10px 12px}
.imp-lista .item.imp.off{opacity:.5}
.imp-lista input[type=checkbox]{width:20px;height:20px;accent-color:var(--teal);flex:none}
.imp-lista select{font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);padding:2px 4px;max-width:150px}
.imp-lista .t2{display:flex;flex-wrap:wrap;align-items:center;gap:4px}

/* demonstração */
#demoBar{position:fixed;left:0;right:0;top:0;z-index:90;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(var(--safe-t) + 8px) 14px 8px;background:#f59e0b;color:#3b2503;font-size:13.5px}
#demoBar a{background:#3b2503;color:#fff;font-weight:700;border-radius:10px;padding:7px 12px;text-decoration:none;white-space:nowrap}
body.demo .top{padding-top:calc(var(--safe-t) + 62px)}
body.demo .olho{top:calc(var(--safe-t) + 58px)}

/* posso comprar */
.btn.mini-largo{margin-top:12px;padding:10px;font-size:14px}
.retro-card.simular{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.retro-card.simular small{color:var(--muted);opacity:1}
.sim-veredito{display:flex;align-items:center;gap:10px;border-radius:14px;padding:12px 14px;margin:4px 0 10px;font-size:16px}
.sim-veredito span{font-size:24px}
.sim-veredito.sim{background:var(--mint-soft);color:var(--accent-ink)}
.sim-veredito.talvez{background:var(--warn-soft);color:var(--warn-ink)}
.sim-veredito.nao{background:var(--danger-soft);color:var(--danger-ink)}
.sim-txt{font-size:14.5px;margin:0 0 10px;line-height:1.45}
.sim-txt b.neg,.sim-meses b.neg{color:var(--bad)} .sim-meses b.warn{color:var(--warn)}
.sim-meses{background:var(--surface-2);border-radius:12px;padding:6px 12px;margin-bottom:10px}
.sim-meses div{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.sim-meses div:last-child{border-bottom:0}
.sim-meses span:first-child{color:var(--muted)}
.sim-mais{color:var(--muted);font-size:13px;justify-content:center!important}
.sim-sug{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;margin-bottom:8px}

/* dicas */
.dicas{display:flex;flex-direction:column;gap:10px}
.dica{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.dica .d-e{font-size:20px;line-height:1.2}
.dica b{color:var(--ink)}
.d-acao{display:block;margin-top:6px;font-size:13px;font-weight:700;color:var(--teal)}
.d-mais{display:block;margin:10px auto 0;font-size:13.5px;font-weight:600;color:var(--teal);padding:6px}

/* cartões */
.cartao{display:block;width:100%;text-align:left;background:var(--surface-2);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:14px}
.cartao .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.cartao .row small{color:var(--muted)}
.cartao .muted{font-size:12.5px}
.cartao .bar{display:block;margin-top:6px}
.cartao .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}

/* reserva ideal */
.reserva-ideal{background:var(--surface-2);border-radius:14px;padding:12px 14px;margin:12px 0 0;font-size:14px}
.reserva-ideal p{margin:6px 0 10px;line-height:1.45;color:var(--muted)}.reserva-ideal p b{color:var(--ink)}
.ri-opcoes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ri-opcoes button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);text-align:center}
.ri-opcoes button b{font-size:14.5px}.ri-opcoes button span{font-size:11px;color:var(--muted);line-height:1.2}
.ri-opcoes button.on{border-color:var(--teal);background:var(--mint-soft)}
.ri-cobre{margin:10px 0 0!important;color:var(--ink)!important}

/* me devem */
.chips.pessoas button{background:var(--mint-soft);color:var(--accent-ink)}

/* retrospectiva do ano e etiquetas */
#retro.r8{background:linear-gradient(160deg,#1e1b4b,#7c3aed 55%,#f59e0b)}
.retro-card.ano{background:linear-gradient(120deg,#1e1b4b,#7c3aed)}
.anos-retro{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.anos-retro .btn{flex:1;min-width:140px;margin:0}

/* busca */
.busca{position:relative;margin-bottom:12px}
.busca input{width:100%;padding:12px 40px 12px 40px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-size:16px;outline:none;color:var(--ink)}
.busca input:focus{border-color:var(--mint)}
.busca svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.busca .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:10px;color:var(--muted);font-size:18px}
.busca .x[hidden]{display:none}
.res-mes{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:12px 16px 4px;background:var(--surface-2)}

/* tema */
.temas{display:flex;gap:8px}
.temas button{flex:1;padding:10px 4px;border-radius:12px;background:var(--track);font-size:14px;font-weight:600;color:var(--muted);border:1.5px solid transparent}
.temas button.on{background:var(--mint-soft);border-color:var(--teal);color:var(--accent-ink)}
</style>
</head>
<body>
<div id="app"></div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
